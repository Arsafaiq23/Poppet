<svg xmlns="http://www.w3.org/2000/svg" width="192" height="24" viewBox="0 0 192 24" shape-rendering="crispEdges">
  <defs>
    <!-- Miso base cat head+body silhouettes -->
    <g id="miso-cat-stand">
      <!-- Ears -->
      <rect x="6" y="4" width="3" height="3" fill="#3b1848"/>
      <rect x="7" y="5" width="2" height="2" fill="#d87a3a"/>
      <rect x="15" y="4" width="3" height="3" fill="#3b1848"/>
      <rect x="15" y="5" width="2" height="2" fill="#d87a3a"/>
      <!-- Head outline & cream fill -->
      <rect x="7" y="6" width="10" height="1" fill="#3b1848"/>
      <rect x="6" y="7" width="12" height="7" fill="#3b1848"/>
      <rect x="7" y="7" width="10" height="6" fill="#fff4e4"/>
      <!-- Ginger forehead patch -->
      <rect x="12" y="7" width="4" height="3" fill="#d87a3a"/>
      <!-- Cheeks -->
      <rect x="7" y="11" width="2" height="1" fill="#ff8fb8"/>
      <rect x="15" y="11" width="2" height="1" fill="#ff8fb8"/>
      <!-- Body -->
      <rect x="7" y="14" width="10" height="5" fill="#3b1848"/>
      <rect x="8" y="14" width="8" height="4" fill="#fff4e4"/>
      <rect x="13" y="15" width="3" height="2" fill="#d87a3a"/>
    </g>
  </defs>

  <!-- Frame 0: walk-a -->
  <g transform="translate(0,0)">
    <use href="#miso-cat-stand"/>
    <!-- Eyes & mouth -->
    <rect x="9" y="10" width="1" height="2" fill="#3b1848"/>
    <rect x="14" y="10" width="1" height="2" fill="#3b1848"/>
    <rect x="11" y="11" width="2" height="1" fill="#3b1848"/>
    <!-- Tail -->
    <rect x="17" y="15" width="2" height="2" fill="#d87a3a"/>
    <rect x="18" y="13" width="2" height="2" fill="#d87a3a"/>
    <!-- Feet walk-a -->
    <rect x="8" y="19" width="2" height="2" fill="#3b1848"/>
    <rect x="14" y="18" width="2" height="2" fill="#3b1848"/>
  </g>

  <!-- Frame 1: walk-b -->
  <g transform="translate(24,0)">
    <g transform="translate(0,-1)">
      <use href="#miso-cat-stand"/>
      <rect x="9" y="10" width="1" height="2" fill="#3b1848"/>
      <rect x="14" y="10" width="1" height="2" fill="#3b1848"/>
      <rect x="11" y="11" width="2" height="1" fill="#3b1848"/>
      <rect x="17" y="14" width="2" height="2" fill="#d87a3a"/>
      <rect x="18" y="12" width="2" height="2" fill="#d87a3a"/>
      <rect x="8" y="18" width="2" height="2" fill="#3b1848"/>
      <rect x="14" y="19" width="2" height="2" fill="#3b1848"/>
    </g>
  </g>

  <!-- Frame 2: sleep-a -->
  <g transform="translate(48,0)">
    <!-- Curled loaf -->
    <rect x="6" y="9" width="2" height="2" fill="#d87a3a"/>
    <rect x="13" y="9" width="2" height="2" fill="#d87a3a"/>
    <rect x="5" y="11" width="12" height="8" fill="#3b1848"/>
    <rect x="6" y="12" width="10" height="6" fill="#fff4e4"/>
    <rect x="11" y="12" width="4" height="3" fill="#d87a3a"/>
    <rect x="17" y="15" width="3" height="2" fill="#d87a3a"/>
    <!-- Closed eyes -->
    <rect x="7" y="15" width="2" height="1" fill="#3b1848"/>
    <rect x="11" y="15" width="2" height="1" fill="#3b1848"/>
    <!-- Zzz -->
    <rect x="17" y="6" width="3" height="1" fill="#7a5a88"/>
    <rect x="18" y="7" width="1" height="1" fill="#7a5a88"/>
    <rect x="17" y="8" width="3" height="1" fill="#7a5a88"/>
  </g>

  <!-- Frame 3: sleep-b -->
  <g transform="translate(72,0)">
    <rect x="6" y="9" width="2" height="2" fill="#d87a3a"/>
    <rect x="13" y="9" width="2" height="2" fill="#d87a3a"/>
    <rect x="5" y="11" width="12" height="8" fill="#3b1848"/>
    <rect x="6" y="12" width="10" height="6" fill="#fff4e4"/>
    <rect x="11" y="12" width="4" height="3" fill="#d87a3a"/>
    <rect x="17" y="15" width="3" height="2" fill="#d87a3a"/>
    <rect x="7" y="15" width="2" height="1" fill="#3b1848"/>
    <rect x="11" y="15" width="2" height="1" fill="#3b1848"/>
    <!-- Zzz shifted up -->
    <rect x="18" y="4" width="3" height="1" fill="#7a5a88"/>
    <rect x="19" y="5" width="1" height="1" fill="#7a5a88"/>
    <rect x="18" y="6" width="3" height="1" fill="#7a5a88"/>
  </g>

  <!-- Frame 4: cheer -->
  <g transform="translate(96,0)">
    <g transform="translate(0,-1)">
      <use href="#miso-cat-stand"/>
      <!-- Happy eyes & open mouth -->
      <rect x="9" y="10" width="1" height="1" fill="#3b1848"/>
      <rect x="14" y="10" width="1" height="1" fill="#3b1848"/>
      <rect x="11" y="11" width="2" height="2" fill="#d12a6e"/>
      <!-- Paws raised -->
      <rect x="4" y="11" width="2" height="3" fill="#3b1848"/>
      <rect x="18" y="11" width="2" height="3" fill="#3b1848"/>
      <!-- Sparkles -->
      <rect x="3" y="6" width="2" height="2" fill="#8ed62a"/>
      <rect x="19" y="6" width="2" height="2" fill="#ff8fb8"/>
      <rect x="8" y="19" width="2" height="2" fill="#3b1848"/>
      <rect x="14" y="19" width="2" height="2" fill="#3b1848"/>
    </g>
  </g>

  <!-- Frame 5: sad -->
  <g transform="translate(120,0)">
    <use href="#miso-cat-stand"/>
    <!-- Sad eyes & tear -->
    <rect x="9" y="10" width="1" height="2" fill="#3b1848"/>
    <rect x="14" y="10" width="1" height="2" fill="#3b1848"/>
    <rect x="8" y="12" width="1" height="2" fill="#5fd0b0"/>
    <rect x="11" y="12" width="2" height="1" fill="#3b1848"/>
    <rect x="8" y="19" width="2" height="2" fill="#3b1848"/>
    <rect x="14" y="19" width="2" height="2" fill="#3b1848"/>
  </g>

  <!-- Frame 6: ears-covered -->
  <g transform="translate(144,0)">
    <use href="#miso-cat-stand"/>
    <!-- Squinted eyes -->
    <rect x="9" y="10" width="2" height="1" fill="#3b1848"/>
    <rect x="13" y="10" width="2" height="1" fill="#3b1848"/>
    <rect x="11" y="12" width="2" height="1" fill="#3b1848"/>
    <!-- Paws over ears -->
    <rect x="4" y="6" width="3" height="5" fill="#d87a3a"/>
    <rect x="17" y="6" width="3" height="5" fill="#d87a3a"/>
    <rect x="8" y="19" width="2" height="2" fill="#3b1848"/>
    <rect x="14" y="19" width="2" height="2" fill="#3b1848"/>
  </g>

  <!-- Frame 7: nom -->
  <g transform="translate(168,0)">
    <use href="#miso-cat-stand"/>
    <!-- Happy chewing eyes -->
    <rect x="9" y="10" width="2" height="1" fill="#3b1848"/>
    <rect x="13" y="10" width="2" height="1" fill="#3b1848"/>
    <rect x="11" y="11" width="2" height="2" fill="#d12a6e"/>
    <!-- Berry treat held at mouth -->
    <rect x="16" y="10" width="4" height="4" fill="#d12a6e"/>
    <rect x="17" y="9" width="2" height="1" fill="#8ed62a"/>
    <rect x="8" y="19" width="2" height="2" fill="#3b1848"/>
    <rect x="14" y="19" width="2" height="2" fill="#3b1848"/>
  </g>
</svg>
