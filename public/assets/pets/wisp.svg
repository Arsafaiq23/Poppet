<svg xmlns="http://www.w3.org/2000/svg" width="192" height="24" viewBox="0 0 192 24" shape-rendering="crispEdges">
  <defs>
    <g id="wisp-body">
      <rect x="7" y="5" width="10" height="1" fill="#2b2e4a"/>
      <rect x="6" y="6" width="12" height="11" fill="#2b2e4a"/>
      <rect x="7" y="6" width="10" height="11" fill="#f8faff"/>
      <rect x="14" y="7" width="2" height="8" fill="#d8e0f8"/>
      <rect x="7" y="11" width="2" height="1" fill="#ff8fb8"/>
      <rect x="15" y="11" width="2" height="1" fill="#ff8fb8"/>
    </g>
  </defs>

  <!-- Frame 0: walk-a -->
  <g transform="translate(0,0)">
    <use href="#wisp-body"/>
    <!-- Eyes & smile -->
    <rect x="9" y="9" width="1" height="2" fill="#2b2e4a"/>
    <rect x="14" y="9" width="1" height="2" fill="#2b2e4a"/>
    <rect x="11" y="11" width="2" height="1" fill="#2b2e4a"/>
    <!-- Wavy tail hem A -->
    <rect x="6" y="17" width="3" height="2" fill="#2b2e4a"/>
    <rect x="7" y="17" width="2" height="1" fill="#f8faff"/>
    <rect x="11" y="17" width="3" height="2" fill="#2b2e4a"/>
    <rect x="11" y="17" width="2" height="1" fill="#f8faff"/>
    <rect x="15" y="17" width="3" height="2" fill="#2b2e4a"/>
    <rect x="15" y="17" width="2" height="1" fill="#f8faff"/>
  </g>

  <!-- Frame 1: walk-b -->
  <g transform="translate(24,-1)">
    <use href="#wisp-body"/>
    <rect x="9" y="9" width="1" height="2" fill="#2b2e4a"/>
    <rect x="14" y="9" width="1" height="2" fill="#2b2e4a"/>
    <rect x="11" y="11" width="2" height="1" fill="#2b2e4a"/>
    <!-- Wavy tail hem B -->
    <rect x="7" y="17" width="3" height="2" fill="#2b2e4a"/>
    <rect x="8" y="17" width="2" height="1" fill="#f8faff"/>
    <rect x="12" y="17" width="3" height="2" fill="#2b2e4a"/>
    <rect x="12" y="17" width="2" height="1" fill="#f8faff"/>
  </g>

  <!-- Frame 2: sleep-a -->
  <g transform="translate(48,1)">
    <use href="#wisp-body"/>
    <rect x="9" y="10" width="2" height="1" fill="#2b2e4a"/>
    <rect x="13" y="10" width="2" height="1" fill="#2b2e4a"/>
    <rect x="7" y="17" width="10" height="1" fill="#2b2e4a"/>
    <!-- Zzz -->
    <rect x="18" y="4" width="3" height="1" fill="#7a5a88"/>
    <rect x="19" y="5" width="1" height="1" fill="#7a5a88"/>
    <rect x="18" y="6" width="3" height="1" fill="#7a5a88"/>
  </g>

  <!-- Frame 3: sleep-b -->
  <g transform="translate(72,1)">
    <use href="#wisp-body"/>
    <rect x="9" y="10" width="2" height="1" fill="#2b2e4a"/>
    <rect x="13" y="10" width="2" height="1" fill="#2b2e4a"/>
    <rect x="7" y="17" width="10" height="1" fill="#2b2e4a"/>
    <!-- Zzz shifted up -->
    <rect x="19" y="2" width="3" height="1" fill="#7a5a88"/>
    <rect x="20" y="3" width="1" height="1" fill="#7a5a88"/>
    <rect x="19" y="4" width="3" height="1" fill="#7a5a88"/>
  </g>

  <!-- Frame 4: cheer -->
  <g transform="translate(96,-1)">
    <use href="#wisp-body"/>
    <rect x="9" y="9" width="1" height="1" fill="#2b2e4a"/>
    <rect x="14" y="9" width="1" height="1" fill="#2b2e4a"/>
    <rect x="11" y="11" width="2" height="2" fill="#d12a6e"/>
    <!-- Stubby arms up -->
    <rect x="4" y="9" width="2" height="3" fill="#2b2e4a"/>
    <rect x="18" y="9" width="2" height="3" fill="#2b2e4a"/>
    <rect x="3" y="5" width="2" height="2" fill="#8ed62a"/>
    <rect x="19" y="5" width="2" height="2" fill="#8ed62a"/>
    <rect x="7" y="17" width="10" height="2" fill="#2b2e4a"/>
  </g>

  <!-- Frame 5: sad -->
  <g transform="translate(120,0)">
    <use href="#wisp-body"/>
    <rect x="9" y="10" width="1" height="2" fill="#2b2e4a"/>
    <rect x="14" y="10" width="1" height="2" fill="#2b2e4a"/>
    <rect x="8" y="12" width="1" height="2" fill="#5fd0b0"/>
    <rect x="11" y="12" width="2" height="1" fill="#2b2e4a"/>
    <rect x="7" y="17" width="10" height="2" fill="#2b2e4a"/>
  </g>

  <!-- Frame 6: ears-covered -->
  <g transform="translate(144,0)">
    <use href="#wisp-body"/>
    <rect x="9" y="9" width="2" height="1" fill="#2b2e4a"/>
    <rect x="13" y="9" width="2" height="1" fill="#2b2e4a"/>
    <rect x="11" y="11" width="2" height="1" fill="#2b2e4a"/>
    <rect x="4" y="7" width="3" height="4" fill="#2b2e4a"/>
    <rect x="5" y="8" width="2" height="2" fill="#f8faff"/>
    <rect x="17" y="7" width="3" height="4" fill="#2b2e4a"/>
    <rect x="17" y="8" width="2" height="2" fill="#f8faff"/>
    <rect x="7" y="17" width="10" height="2" fill="#2b2e4a"/>
  </g>

  <!-- Frame 7: nom -->
  <g transform="translate(168,0)">
    <use href="#wisp-body"/>
    <rect x="9" y="9" width="2" height="1" fill="#2b2e4a"/>
    <rect x="13" y="9" width="2" height="1" fill="#2b2e4a"/>
    <rect x="11" y="11" width="2" height="2" fill="#d12a6e"/>
    <!-- Berry treat -->
    <rect x="16" y="10" width="4" height="4" fill="#d12a6e"/>
    <rect x="17" y="9" width="2" height="1" fill="#8ed62a"/>
    <rect x="7" y="17" width="10" height="2" fill="#2b2e4a"/>
  </g>
</svg>
