<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Standard crisp UI icons (Lean-in expanded bar, buttons A/B/C, popovers) -->
  <symbol id="play" viewBox="0 0 24 24">
    <path d="M8.5 5.8c0-.9 1-1.4 1.8-.9l9.2 6.2c.7.4.7 1.4 0 1.8l-9.2 6.2c-.8.5-1.8 0-1.8-.9V5.8Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  </symbol>

  <symbol id="pause" viewBox="0 0 24 24">
    <rect x="6.5" y="5" width="4" height="14" rx="1.6" fill="currentColor"/>
    <rect x="13.5" y="5" width="4" height="14" rx="1.6" fill="currentColor"/>
  </symbol>

  <symbol id="volume" viewBox="0 0 24 24">
    <path d="M4.5 9.5h3.3l4.7-4.1c.6-.5 1.5-.1 1.5.7v11.8c0 .8-.9 1.2-1.5.7l-4.7-4.1H4.5c-.8 0-1.5-.7-1.5-1.5v-2c0-.8.7-1.5 1.5-1.5Z" fill="currentColor"/>
    <path d="M16.8 8.8a4.6 4.6 0 0 1 0 6.4M19.3 6.3a8 8 0 0 1 0 11.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <symbol id="volume-heart" viewBox="0 0 24 24">
    <path d="M3.5 9.5h3l4.3-3.8c.6-.5 1.4-.1 1.4.7v11.2c0 .8-.8 1.2-1.4.7L6.5 14.5h-3c-.8 0-1.5-.7-1.5-1.5v-2c0-.8.7-1.5 1.5-1.5Z" fill="currentColor"/>
    <path d="M18 15.8s-3.8-2.4-4.6-4.7c-.5-1.5.3-3.1 1.9-3.1 1 0 1.8.6 2.7 1.5.9-.9 1.7-1.5 2.7-1.5 1.6 0 2.4 1.6 1.9 3.1-.8 2.3-4.6 4.7-4.6 4.7Z" fill="currentColor"/>
  </symbol>

  <symbol id="muted" viewBox="0 0 24 24">
    <path d="M4.5 9.5h3.3l4.7-4.1c.6-.5 1.5-.1 1.5.7v11.8c0 .8-.9 1.2-1.5.7l-4.7-4.1H4.5c-.8 0-1.5-.7-1.5-1.5v-2c0-.8.7-1.5 1.5-1.5Z" fill="currentColor"/>
    <path d="M16.5 9.5l4.5 5m0-5l-4.5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </symbol>

  <symbol id="fullscreen" viewBox="0 0 24 24">
    <path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9m6 0h3.5A1.5 1.5 0 0 1 20 5.5V9m0 6v3.5a1.5 1.5 0 0 1-1.5 1.5H15m-6 0H5.5A1.5 1.5 0 0 1 4 18.5V15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="exit-fullscreen" viewBox="0 0 24 24">
    <path d="M9 4v3.5A1.5 1.5 0 0 1 7.5 9H4m16 0h-3.5A1.5 1.5 0 0 1 15 7.5V4m0 16v-3.5a1.5 1.5 0 0 1 1.5-1.5H20M4 15h3.5A1.5 1.5 0 0 1 9 16.5V20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="heart" viewBox="0 0 24 24">
    <path d="M12 20.5s-7.5-4.7-9.2-9.2C1.7 8.4 3.4 5 6.8 5c2 0 3.5 1.1 5.2 2.9C13.7 6.1 15.2 5 17.2 5c3.4 0 5.1 3.4 4 6.3-1.7 4.5-9.2 9.2-9.2 9.2Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  </symbol>

  <symbol id="heart-empty" viewBox="0 0 24 24">
    <path d="M12 20.5s-7.5-4.7-9.2-9.2C1.7 8.4 3.4 5 6.8 5c2 0 3.5 1.1 5.2 2.9C13.7 6.1 15.2 5 17.2 5c3.4 0 5.1 3.4 4 6.3-1.7 4.5-9.2 9.2-9.2 9.2Z" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/>
  </symbol>

  <symbol id="shortcuts" viewBox="0 0 24 24">
    <path d="M9.3 8.8a2.9 2.9 0 0 1 5.6.9c0 1.9-2.8 2.4-2.8 4.3m0 3.5h.02" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="replay" viewBox="0 0 24 24">
    <path d="M5 12a7 7 0 1 0 2.1-5L4.5 9.5M4.5 4.8v4.7h4.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="gear" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M12 4v2m0 12v2M4 12h2m12 0h2M6.3 6.3l1.4 1.4m8.6 8.6 1.4 1.4m0-11.4-1.4 1.4m-8.6 8.6-1.4 1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <symbol id="close" viewBox="0 0 24 24">
    <path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  </symbol>

  <!-- 1-bit pixel-style LCD icons (16x16 snapped rects/paths, crisp at small scale) -->
  <!-- Top row: [Feed] fork & spoon/snack -->
  <symbol id="lcd-feed" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="3" y="2" width="1" height="5" fill="currentColor"/>
    <rect x="5" y="2" width="1" height="5" fill="currentColor"/>
    <rect x="7" y="2" width="1" height="5" fill="currentColor"/>
    <rect x="3" y="6" width="5" height="2" fill="currentColor"/>
    <rect x="5" y="8" width="1" height="6" fill="currentColor"/>
    <rect x="11" y="2" width="2" height="12" fill="currentColor"/>
    <rect x="10" y="3" width="1" height="5" fill="currentColor"/>
  </symbol>

  <!-- Top row: [Light] pixel bulb -->
  <symbol id="lcd-light" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="6" y="1" width="4" height="1" fill="currentColor"/>
    <rect x="4" y="2" width="2" height="2" fill="currentColor"/>
    <rect x="10" y="2" width="2" height="2" fill="currentColor"/>
    <rect x="3" y="4" width="1" height="4" fill="currentColor"/>
    <rect x="12" y="4" width="1" height="4" fill="currentColor"/>
    <rect x="7" y="5" width="2" height="4" fill="currentColor"/>
    <rect x="6" y="6" width="4" height="1" fill="currentColor"/>
    <rect x="4" y="8" width="2" height="2" fill="currentColor"/>
    <rect x="10" y="8" width="2" height="2" fill="currentColor"/>
    <rect x="5" y="10" width="6" height="2" fill="currentColor"/>
    <rect x="6" y="13" width="4" height="2" fill="currentColor"/>
    <rect x="1" y="5" width="1" height="1" fill="currentColor"/>
    <rect x="14" y="5" width="1" height="1" fill="currentColor"/>
  </symbol>

  <!-- Top row: [Play] pixel play triangle & pause bars -->
  <symbol id="lcd-play" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="4" y="2" width="2" height="12" fill="currentColor"/>
    <rect x="6" y="3" width="2" height="10" fill="currentColor"/>
    <rect x="8" y="4" width="2" height="8" fill="currentColor"/>
    <rect x="10" y="6" width="2" height="4" fill="currentColor"/>
    <rect x="12" y="7" width="1" height="2" fill="currentColor"/>
  </symbol>

  <symbol id="lcd-pause" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="4" y="3" width="3" height="10" fill="currentColor"/>
    <rect x="9" y="3" width="3" height="10" fill="currentColor"/>
  </symbol>

  <!-- Top row: [Heal] pixel medical cross / syringe -->
  <symbol id="lcd-heal" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="6" y="2" width="4" height="12" fill="currentColor"/>
    <rect x="2" y="6" width="12" height="4" fill="currentColor"/>
    <rect x="7" y="4" width="2" height="8" fill="currentColor" opacity="0.25"/>
  </symbol>

  <!-- Bottom row: [Sound] pixel speaker -->
  <symbol id="lcd-sound" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="2" y="6" width="3" height="4" fill="currentColor"/>
    <rect x="5" y="4" width="2" height="8" fill="currentColor"/>
    <rect x="7" y="2" width="2" height="12" fill="currentColor"/>
    <rect x="11" y="5" width="1" height="6" fill="currentColor"/>
    <rect x="13" y="3" width="1" height="10" fill="currentColor"/>
  </symbol>

  <symbol id="lcd-muted" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="2" y="6" width="3" height="4" fill="currentColor"/>
    <rect x="5" y="4" width="2" height="8" fill="currentColor"/>
    <rect x="7" y="2" width="2" height="12" fill="currentColor"/>
    <rect x="11" y="5" width="1" height="2" fill="currentColor"/>
    <rect x="13" y="5" width="1" height="2" fill="currentColor"/>
    <rect x="12" y="7" width="1" height="2" fill="currentColor"/>
    <rect x="11" y="9" width="1" height="2" fill="currentColor"/>
    <rect x="13" y="9" width="1" height="2" fill="currentColor"/>
  </symbol>

  <!-- Bottom row: [Speed] pixel gauge/dial -->
  <symbol id="lcd-speed" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="4" y="3" width="8" height="2" fill="currentColor"/>
    <rect x="2" y="5" width="2" height="6" fill="currentColor"/>
    <rect x="12" y="5" width="2" height="6" fill="currentColor"/>
    <rect x="3" y="11" width="10" height="2" fill="currentColor"/>
    <rect x="7" y="9" width="2" height="2" fill="currentColor"/>
    <rect x="8" y="7" width="2" height="2" fill="currentColor"/>
    <rect x="10" y="5" width="1" height="2" fill="currentColor"/>
  </symbol>

  <!-- Bottom row: [Lean in] pixel expand / zoom-in & zoom-out -->
  <symbol id="lcd-lean" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="2" y="2" width="5" height="2" fill="currentColor"/>
    <rect x="2" y="2" width="2" height="5" fill="currentColor"/>
    <rect x="9" y="2" width="5" height="2" fill="currentColor"/>
    <rect x="12" y="2" width="2" height="5" fill="currentColor"/>
    <rect x="2" y="12" width="5" height="2" fill="currentColor"/>
    <rect x="2" y="9" width="2" height="5" fill="currentColor"/>
    <rect x="9" y="12" width="5" height="2" fill="currentColor"/>
    <rect x="12" y="9" width="2" height="5" fill="currentColor"/>
    <rect x="6" y="6" width="4" height="4" fill="currentColor"/>
  </symbol>

  <symbol id="lcd-lean-out" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="2" y="5" width="4" height="2" fill="currentColor"/>
    <rect x="4" y="2" width="2" height="5" fill="currentColor"/>
    <rect x="10" y="5" width="4" height="2" fill="currentColor"/>
    <rect x="10" y="2" width="2" height="5" fill="currentColor"/>
    <rect x="2" y="9" width="4" height="2" fill="currentColor"/>
    <rect x="4" y="9" width="2" height="5" fill="currentColor"/>
    <rect x="10" y="9" width="4" height="2" fill="currentColor"/>
    <rect x="10" y="9" width="2" height="5" fill="currentColor"/>
  </symbol>

  <!-- Bottom row: [Info] pixel info / question book -->
  <symbol id="lcd-info" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="5" y="2" width="6" height="2" fill="currentColor"/>
    <rect x="3" y="4" width="2" height="2" fill="currentColor"/>
    <rect x="11" y="4" width="2" height="3" fill="currentColor"/>
    <rect x="9" y="7" width="2" height="2" fill="currentColor"/>
    <rect x="7" y="8" width="2" height="2" fill="currentColor"/>
    <rect x="7" y="12" width="2" height="2" fill="currentColor"/>
  </symbol>

  <!-- Blinking pixel arrow ▸ for the active LCD menu cursor -->
  <symbol id="lcd-cursor-arrow" viewBox="0 0 8 10" shape-rendering="crispEdges">
    <rect x="1" y="1" width="2" height="8" fill="currentColor"/>
    <rect x="3" y="2" width="2" height="6" fill="currentColor"/>
    <rect x="5" y="3" width="2" height="4" fill="currentColor"/>
    <rect x="7" y="4" width="1" height="2" fill="currentColor"/>
  </symbol>

  <!-- Embossed pixel glyphs for hardware buttons A (NEXT), B (OK / PLAY / PAUSE), C (BACK) -->
  <symbol id="btn-next" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="3" y="3" width="2" height="10" fill="currentColor"/>
    <rect x="5" y="4" width="2" height="8" fill="currentColor"/>
    <rect x="7" y="5" width="2" height="6" fill="currentColor"/>
    <rect x="9" y="6" width="2" height="4" fill="currentColor"/>
    <rect x="11" y="7" width="2" height="2" fill="currentColor"/>
  </symbol>

  <symbol id="btn-ok-dot" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="6" y="4" width="4" height="8" fill="currentColor"/>
    <rect x="4" y="6" width="8" height="4" fill="currentColor"/>
    <rect x="5" y="5" width="6" height="6" fill="currentColor"/>
  </symbol>

  <symbol id="btn-play" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="4" y="3" width="2" height="10" fill="currentColor"/>
    <rect x="6" y="4" width="2" height="8" fill="currentColor"/>
    <rect x="8" y="5" width="2" height="6" fill="currentColor"/>
    <rect x="10" y="6" width="2" height="4" fill="currentColor"/>
    <rect x="12" y="7" width="1" height="2" fill="currentColor"/>
  </symbol>

  <symbol id="btn-pause" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="4" y="3" width="3" height="10" fill="currentColor"/>
    <rect x="9" y="3" width="3" height="10" fill="currentColor"/>
  </symbol>

  <symbol id="btn-back" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <!-- Crisp pixel return/back arrow ↩ -->
    <rect x="6" y="3" width="2" height="2" fill="currentColor"/>
    <rect x="4" y="5" width="2" height="2" fill="currentColor"/>
    <rect x="2" y="6" width="10" height="2" fill="currentColor"/>
    <rect x="4" y="8" width="2" height="2" fill="currentColor"/>
    <rect x="6" y="10" width="2" height="2" fill="currentColor"/>
    <rect x="12" y="7" width="2" height="5" fill="currentColor"/>
    <rect x="8" y="11" width="5" height="2" fill="currentColor"/>
  </symbol>

  <!-- 1-bit pixel heart for feed reaction -->
  <symbol id="pixel-heart" viewBox="0 0 11 10" shape-rendering="crispEdges">
    <rect x="1" y="1" width="3" height="2" fill="currentColor"/>
    <rect x="7" y="1" width="3" height="2" fill="currentColor"/>
    <rect x="0" y="2" width="5" height="3" fill="currentColor"/>
    <rect x="6" y="2" width="5" height="3" fill="currentColor"/>
    <rect x="1" y="4" width="9" height="2" fill="currentColor"/>
    <rect x="2" y="6" width="7" height="1" fill="currentColor"/>
    <rect x="3" y="7" width="5" height="1" fill="currentColor"/>
    <rect x="4" y="8" width="3" height="1" fill="currentColor"/>
    <rect x="5" y="9" width="1" height="1" fill="currentColor"/>
  </symbol>
</svg>
